<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Rawi Creator Marketplace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: two-tier app header (brand bar + scrolling tab strip) over a campaign context strip; single 1040px working column of quiet cards */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#F0F2F5; --line:#E2E6EB; --line-strong:#CDD3DB;
  --ink:#0F1A24; --ink-2:#2A3542; --muted:#667180; --accent:#0B6B5C; --accent-hover:#095A4D; --accent-ink:#FFFFFF; --accent-soft:#E3F1EE;
  --saffron:#D99A1E; --saffron-soft:#FCF3E1;
  --ok:#17763A; --ok-soft:#E5F4EA; --warn:#8A5300; --warn-soft:#FCF0DC; --bad:#B42318; --bad-soft:#FDECEA;
  --shadow:0 1px 2px rgba(15,26,36,.05),0 1px 1px rgba(15,26,36,.03);
  --f-ui:"Manrope","IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-ar:"IBM Plex Sans Arabic","Manrope",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1116; --surface:#131A21; --sunk:#1A222B; --line:#252F3A; --line-strong:#34404D;
  --ink:#E8EDF2; --ink-2:#C7D0D9; --muted:#8C98A6; --accent:#3FB6A1; --accent-hover:#5CC6B3; --accent-ink:#04201B; --accent-soft:#12302B;
  --saffron:#E9B44C; --saffron-soft:#33290F;
  --ok:#5CCB82; --ok-soft:#13291C; --warn:#F0B35A; --warn-soft:#33250F; --bad:#FF8B80; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1116; --surface:#131A21; --sunk:#1A222B; --line:#252F3A; --line-strong:#34404D;
  --ink:#E8EDF2; --ink-2:#C7D0D9; --muted:#8C98A6; --accent:#3FB6A1; --accent-hover:#5CC6B3; --accent-ink:#04201B; --accent-soft:#12302B;
  --saffron:#E9B44C; --saffron-soft:#33290F;
  --ok:#5CCB82; --ok-soft:#13291C; --warn:#F0B35A; --warn-soft:#33250F; --bad:#FF8B80; --bad-soft:#3A1715;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-ui);text-wrap:balance;margin:0;line-height:1.25;color:var(--ink)}
h2{font-size:1.2rem;font-weight:700;letter-spacing:-.015em}
h3{font-size:.95rem;font-weight:700;letter-spacing:-.005em}
p{margin:0}
b,strong{font-weight:700}
[dir=rtl],[dir=auto]{font-family:var(--f-ar)}
.mono{font-family:var(--f-mono);font-size:.92em}
.num,td.num,.stat b,.score .num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar > .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.logo{display:flex;align-items:center;gap:10px;margin-inline-end:auto;min-width:0}
.logo svg{flex:none}
.logo .name{display:grid;line-height:1.1}
.logo b{font-size:1.05rem;letter-spacing:-.02em}
.logo .ar{font-family:var(--f-ar);font-size:.78rem;color:var(--muted)}
.logo .demo{font-size:.68rem;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-inline-start:2px}
.seg{display:inline-flex;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:3px;flex:none}
.seg button{border:0;background:transparent;color:var(--muted);font:600 .82rem var(--f-ui);padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs .wrap{display:flex;flex-wrap:nowrap;gap:4px;padding-block:0;min-width:max-content}
.tabs button{border:0;background:none;color:var(--muted);font:600 .86rem var(--f-ui);padding:11px 10px 12px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs button:hover{color:var(--ink-2)}
.tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.tabs button .n{font-size:.72rem;font-weight:700;background:var(--sunk);color:var(--muted);border-radius:999px;padding:0 7px;line-height:1.6}
.tabs button[aria-current="page"] .n{background:var(--accent-soft);color:var(--accent)}
.ctx{border-bottom:1px solid var(--line);background:var(--bg)}
.ctx .wrap{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;padding-block:10px;font-size:.82rem;color:var(--muted)}
.ctx b{color:var(--ink);font-weight:700}
.ctx .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block;margin-inline-end:6px}

main .wrap{padding-block:22px 56px;display:grid;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:16px;min-width:0;box-shadow:var(--shadow)}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.head > div{display:grid;gap:4px;min-width:0;flex:1 1 260px}
.head > div > p.muted{max-width:62ch}
.eyebrow{font-size:.72rem;font-weight:700;color:var(--muted);letter-spacing:.02em}

/* Controls */
label.f{display:grid;gap:6px;font-weight:600;font-size:.84rem;color:var(--ink-2)}
textarea,input[type=text],input[type=number],select{width:100%;font:inherit;font-size:.92rem;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 12px;transition:border-color .15s}
input[type=file]{font:inherit;font-size:.85rem;color:var(--muted)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
textarea:hover,input:hover,select:hover{border-color:var(--muted)}
textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row > *{flex:1 1 180px;min-width:0}
.btn{border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font:600 .85rem var(--f-ui);height:36px;padding:0 14px;border-radius:var(--r-sm);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center;white-space:nowrap;transition:background .15s,border-color .15s}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{height:30px;padding:0 11px;font-size:.8rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.86rem;cursor:pointer;color:var(--ink-2)}
.check input{accent-color:var(--accent);width:16px;height:16px}
details summary{font-size:.85rem}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:6px;font-size:.73rem;font-weight:600;line-height:1;padding:5px 9px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap;border:1px solid transparent}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.sf{background:transparent;color:var(--muted);border-color:var(--line)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.plain::before,.chip.sf::before{display:none}
.chip.plain{background:var(--surface);border-color:var(--line);color:var(--ink-2)}
.note{font-size:.84rem;background:var(--saffron-soft);color:var(--ink);border-radius:var(--r-sm);padding:10px 12px;border:1px solid color-mix(in srgb,var(--saffron) 30%,transparent)}
.status{font-size:.83rem;color:var(--muted)}
.err{color:var(--bad)}

/* Brief */
.brief{display:grid;gap:18px 24px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.brief section{display:grid;gap:6px;align-content:start;min-width:0}
.brief section h3{font-size:.78rem;color:var(--muted);font-weight:700;letter-spacing:.02em}
.brief ul{margin:0;padding-inline-start:18px;display:grid;gap:5px;color:var(--ink-2)}
.brief .full{grid-column:1/-1}
.hook{font-size:.95rem;font-weight:600;background:var(--sunk);border-radius:var(--r-sm);padding:9px 12px;border-inline-start:3px solid var(--saffron)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.88rem}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:600}

/* Creator list */
.list{display:grid;gap:10px}
.creator{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s}
.creator:hover{border-color:var(--line-strong)}
.creator.off{opacity:.55}
.creator h3 span{font-weight:500}
.av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.95rem;color:var(--accent);background:var(--accent-soft)}
.creator .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.creator .why{font-size:.82rem;color:var(--muted);margin-top:6px}
.score{display:grid;justify-items:end;gap:6px}
.score .num{font-size:1.25rem;font-weight:800;letter-spacing:-.02em}
.score .num small{font-size:.7rem;color:var(--muted);font-weight:600;letter-spacing:0}
.meter{width:76px;height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}
@media (max-width:560px){.creator{grid-template-columns:40px 1fr}.score{grid-column:1/-1;grid-auto-flow:column;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:10px}.av{width:40px;height:40px}}

/* Drafts and cards inside panels */
.draft{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:grid;gap:12px;padding:16px;min-width:0}
.script{white-space:pre-wrap;font-size:.9rem;background:var(--sunk);border-radius:var(--r-sm);padding:12px 14px;color:var(--ink-2)}
.checks{display:grid;gap:7px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:20px 1fr;gap:9px;font-size:.86rem;align-items:start}
.checks .ic{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:.65rem;font-weight:800;margin-top:1px}
.ic.p{background:var(--ok-soft);color:var(--ok)}
.ic.f{background:var(--bad-soft);color:var(--bad)}
.aiout{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:3px;align-content:start}
.stat .eyebrow{font-size:.76rem;font-weight:600}
.stat b{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
.stat .muted{font-size:.78rem!important}

/* Tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:.86rem;min-width:520px}
th,td{text-align:start;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:.74rem;color:var(--muted);font-weight:700;background:var(--sunk)}
td.num,th.num{text-align:end}
tbody tr:hover td{background:color-mix(in srgb,var(--sunk) 55%,transparent)}

/* Permit */
.permit{border-radius:var(--r);padding:18px;background:var(--ink);color:var(--surface);display:grid;gap:6px;position:relative;overflow:hidden}
.permit::after{content:"";position:absolute;inset:auto -40px -60px auto;width:180px;height:180px;border-radius:50%;border:24px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.permit .mono{font-size:1.1rem;letter-spacing:.06em}
.permit .eyebrow{color:inherit;opacity:.7}

/* Results */
.conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.acct{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:10px;align-content:start}
.acct .top{display:flex;align-items:center;gap:10px}
.pl{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;font:800 .78rem var(--f-ui);background:var(--ink);color:var(--surface);flex:none}
.consent{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:12px;display:grid;gap:8px;font-size:.84rem;background:var(--sunk)}
.consent ul{margin:0;padding-inline-start:18px}
.chart{position:relative;min-width:0}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--f-ui)}
.chart .area{fill:var(--accent);opacity:.1}
.chart .line{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .xh{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--surface);font-size:.78rem;font-weight:600;padding:6px 9px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-125%);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.vbar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;min-width:60px}
.vbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
td .vbar{margin-top:6px}
.sync{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){
  .tablewrap:has(.rtable){border:0;border-radius:0}
  table.rtable{min-width:0}
  .rtable thead{display:none}
  .rtable tr{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px 12px;padding:14px 0;border-bottom:1px solid var(--line)}
  .rtable td{border:0;padding:0;text-align:start!important;background:none!important}
  .rtable td:first-child,.rtable td.wide{grid-column:1/-1}
  .rtable td[data-l]::before{content:attr(data-l);display:block;font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:2px}
}

/* Money timeline + ledger */
.msteps{list-style:none;margin:0;padding:0;display:grid}
.mstep{display:grid;grid-template-columns:26px 1fr;gap:12px;padding-bottom:16px;position:relative}
.mstep:not(:last-child)::before{content:"";position:absolute;left:12px;top:26px;bottom:2px;width:2px;background:var(--line)}
.mstep.done:not(:last-child)::before{background:var(--accent)}
.mdot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:.75rem;font-weight:800;background:var(--surface);border:2px solid var(--line-strong);color:var(--muted);position:relative}
.mstep.done .mdot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mstep.active .mdot{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.mstep > div{padding-top:3px;display:grid;gap:8px;min-width:0}
.mstep b{font-weight:600}
.ledger{list-style:none;margin:0;padding:0;display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ledger li{display:grid;grid-template-columns:60px 1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:.84rem}
.ledger li:last-child{border-bottom:0}
.ledger li .mono{font-family:var(--f-ui);font-size:.78rem}
@media (max-width:560px){.ledger li{grid-template-columns:50px 1fr auto;padding:10px 12px}.ledger li .chip{display:none}}

.vup{border:1px dashed var(--line-strong);border-radius:var(--r-sm);padding:12px;display:grid;gap:8px}
.vbox{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.thumbs figure{margin:0;display:grid;gap:4px}
.thumbs img{width:100%;aspect-ratio:9/16;object-fit:cover;border-radius:6px;background:var(--sunk);border:1px solid var(--line)}
.thumbs figcaption{font-size:.72rem;color:var(--muted);text-align:center}
.lib{display:grid;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.librow{display:grid;grid-template-columns:28px 1fr 120px auto;gap:14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.librow:last-child{border-bottom:0}
.rank{width:26px;height:26px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-weight:800;font-size:.8rem;color:var(--muted)}
.librow:nth-child(-n+3) .rank{background:var(--accent-soft);color:var(--accent)}
.hookline{font-size:.84rem;color:var(--ink-2);margin-top:4px}
.libstat{display:grid;gap:3px;font-size:.78rem}
.libstat b{font-size:1rem}
@media (max-width:640px){.librow{grid-template-columns:26px 1fr;}.libstat{grid-column:2;grid-template-columns:auto auto 1fr;align-items:center;gap:6px}.libstat span:last-child{grid-column:1/-1}.librow .btn{grid-column:2;justify-self:start}}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:20;padding-inline:16px}
.toast div{background:var(--ink);color:var(--surface);padding:11px 16px;border-radius:10px;font-size:.86rem;font-weight:600;box-shadow:0 8px 24px rgba(15,26,36,.2);max-width:520px}
@media (prefers-reduced-motion:no-preference){.toast div{animation:up .2s ease-out}@keyframes up{from{transform:translateY(8px);opacity:0}}}
</style>

<header class="bar">
  <div class="wrap">
    <div class="logo"><svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="8" fill="var(--accent)"/><path d="M9 21V9h6.2a3.8 3.8 0 0 1 .9 7.5L20 21h-3.3l-3.6-4.3H12V21z" fill="var(--accent-ink)"/><circle cx="21.5" cy="9.5" r="2" fill="var(--saffron)"/></svg><span class="name"><b>Rawi</b><span class="ar">راوي</span></span><span class="demo">Demo</span></div>
    <div class="seg" role="group" aria-label="View as">
      <button id="mode-brand" data-mode="brand" aria-pressed="true">Brand</button>
      <button id="mode-creator" data-mode="creator" aria-pressed="false">Creator</button>
    </div>
  </div>
  <nav class="tabs" aria-label="Sections"><div class="wrap" id="tabs"></div></nav>
</header>
<div class="ctx" id="ctx" hidden><div class="wrap" id="ctx-in"></div></div>
<main><div class="wrap" id="view"></div></main>
<div class="toast" id="toast" hidden><div id="toast-msg"></div></div>

<script>
(() => {
const FEE = 0.12;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const aed = n => "AED " + Math.round(n).toLocaleString("en-US");
const isArabic = s => /[؀-ۿ]/.test(s || "");

/* ---------- Sample data (invented, marked as examples in the UI) ---------- */
const SAMPLE_GOAL = "Launch Tamrah date-and-oat bars for Ramadan. We need 30 short TikTok and Reels videos in Khaleeji Arabic for the UAE and Saudi. Focus on suhoor energy and gifting to family.";
const SAMPLE_BRIEF = {
  example: true,

function briefWords(){
  const b = S.brief; const t = [b.title,b.audience,b.dialect,...b.hooks,...b.dos,S.goal,S.markets].join(" ").toLowerCase();
  return t;
}
function match(c){
  const t = briefWords(); let score = 40; const why = [];
  const ksa = /ksa|saudi|السعودية|riyadh|jeddah/.test(t), uae = /uae|emirat|dubai|الإمارات|abu dhabi/.test(t);
  if ((c.market==="UAE"&&uae)||(c.market==="KSA"&&ksa)){score+=18;why.push(c.market+" audience")}
  const dl = c.dialect.toLowerCase();
  const v = verifiedDialect(c), tag = v ? "" : " (self-declared)";
  if (/khaleeji|gulf|خليج/.test(t) && /emirati|najdi|khaleeji/.test(dl)){score+= v?16:8;why.push(c.dialect+" dialect"+tag)}
  else if (t.includes(dl.split(" ")[0])){score+= v?12:6;why.push(c.dialect+" dialect"+tag)}
  const hits = c.niches.filter(n => t.includes(n) || (n==="snacks"&&/bar|snack/.test(t)) || (n==="gifting"&&/gift/.test(t)));
  score += hits.length*8; if(hits.length) why.push(hits.join(", ")+" content");
  score += Math.round((c.rel-80)/2);
  return {score: Math.max(0,Math.min(99,score)), why};
}
function matchBrief(c, b){
  const licensed = b.markets.filter(m => (m==="UAE" && c.permit.type.startsWith("UAE")) || (m==="KSA" && c.permit.type==="Mawthooq"));
  if (c.permit.status!=="verified") return {hidden:"Your permit isn't verified"};
  if (!licensed.length) return {hidden: b.markets.includes("KSA") ? "Needs a Saudi Mawthooq licence" : "Needs a UAE Advertiser Permit"};
  if (b.fee < c.rate*0.75) return {hidden:"Pays well below your rate ("+aed(b.fee)+" vs "+aed(c.rate)+")"};
  let score = 40; const why = [];
  score += 18; why.push(licensed.join(" + ")+" audience" + (licensed.length<b.markets.length ? " (you're licensed for "+licensed.join(", ")+" posts only)" : ""));
  if (b.dialects.some(d => c.dialect.includes(d))){ score += verifiedDialect(c)?16:8; why.push(c.dialect+" dialect"+(verifiedDialect(c)?"":" (self-declared)")); }
  const hits = c.niches.filter(n => b.niches.includes(n)); score += hits.length*8; if (hits.length) why.push(hits.join(", ")+" content");
  score += Math.round((c.rel-80)/2); score = Math.min(99, score);
  if (score < 55) return {hidden:"Weak fit ("+score+"/99): "+(hits.length?"":"no topic overlap")+(b.dialects.some(d=>c.dialect.includes(d))?"":", different language")};
  return {score, why};
}

}

/* ---------- Money engine: escrow ledger ----------
   Brand funds fixed fees + bonus caps into escrow (+ Rawi fee).
   Fees release on approval; bonuses pay at day 7 and day 30 from verified views; the rest returns to the brand at close. */
const BONUS_STAGES = {7:0.7, 30:1};            // share of final views counted at each payout
function L(){ if (!S.ledger) S.ledger = initLedger(); return S.ledger; }
function initLedger(){
  const ev = []; let fees = 0, caps = 0, n = 0;
  for (const [id,k] of Object.entries(S.contracts)){ const c=byId(id); fees += c.rate*k.videos; caps += BONUS_CAP*k.videos; n += k.videos; }
  ev.push({date:"3 Oct", type:"fund", text:`Brand funded escrow for ${n} videos: fees ${aed(fees)} + bonus caps ${aed(caps)}`, amount:fees+caps});
  ev.push({date:"3 Oct", type:"fee", text:`Rawi fee charged (${Math.round(FEE*100)}% of creator fees)`, amount:fees*FEE});
  VIDEOS.slice().sort((a,b)=>a.start-b.start).forEach(v => { const c=byId(v.creator); ev.push({date:DAYS[v.start], type:"release", creator:c.id, vid:v.id, text:`Fee released to ${c.name}: “${v.title}” approved`, amount:c.rate}); });
  return ev;
}
const sumL = (type, cid, vid) => L().filter(e => e.type===type && (!cid || e.creator===cid) && (!vid || e.vid===vid)).reduce((s,e)=>s+e.amount,0);
const countL = (type, cid) => L().filter(e => e.type===type && e.creator===cid).length;
function topUp(cid, n, why){
  const c = byId(cid);
  L().push({date:"Today", type:"fund", creator:cid, text:`Escrow top-up for ${c.name}: ${n} video${n>1?"s":""} (${why})`, amount:n*(c.rate+BONUS_CAP)});
  L().push({date:"Today", type:"fee", creator:cid, text:`Rawi fee on ${c.name}'s top-up`, amount:n*c.rate*FEE});
}
function creatorMoney(cid){
  const c = byId(cid), k = S.contracts[cid]; if (!k) return null;
  const funded = k.videos*(c.rate+BONUS_CAP), fees = sumL("release",cid), bonus = sumL("bonus",cid), returned = sumL("refund",cid);
  return {c, videos:k.videos, approved:countL("release",cid), funded, fees, bonus, returned, held: funded-fees-bonus-returned};
}
function approveDraft(d, auto){
  const c = byId(d.creator);
  if (!S.contracts[c.id]){ S.contracts[c.id] = {videos:0}; S.invited.add(c.id); }
  if (countL("release",c.id) >= S.contracts[c.id].videos){ topUp(c.id, 1, "extra video"); S.contracts[c.id].videos++; }
  d.status = "approved"; d.issues = localChecks(d.text, c).filter(x=>!x.pass).map(x=>x.label);
  if (d.vai && d.vai.checks) d.issues.push(...d.vai.checks.filter(x=>!x.pass).map(x=>"Video: "+x.label));
  L().push({date:"Today", type:"release", creator:c.id, text:`Fee released to ${c.name}: draft ${auto?"auto-approved after 5 working days":"approved by brand"}`, amount:c.rate});
}
function runBonus(day){
  const frac = BONUS_STAGES[day]; let total = 0; const skipped = [];
  VIDEOS.filter(v => S.contracts[v.creator]).forEach(v => {
    const c = byId(v.creator);
    if (!isLive(v)){ skipped.push(`${c.name} (${PLAT[v.platform].name} not connected)`); return; }
    const target = Math.min(BONUS_CAP, Math.round(v.views*frac/1000*BONUS_PER_K));
    const pay = target - sumL("bonus", c.id, v.id);
    if (pay > 0){ total += pay; L().push({date:`Day ${day}`, type:"bonus", creator:c.id, vid:v.id, text:`Day-${day} view bonus to ${c.name}: ${fmt(v.views*frac)} verified views on “${v.title}”`, amount:pay}); }
  });
  S.stage = day;
  return {total, skipped};
}
function closeCampaign(){
  S.drafts.filter(d=>d.status==="submitted").forEach(d => approveDraft(d, true));
  let refund = 0, feeBack = 0;
  for (const cid of Object.keys(S.contracts)){
    const m = creatorMoney(cid); const unusedSlots = m.videos - m.approved;
    if (m.held > 0){ refund += m.held; L().push({date:"Day 30", type:"refund", creator:cid, text:`Returned to brand from ${m.c.name}: ${unusedSlots>0?unusedSlots+" unused video slot"+(unusedSlots>1?"s":"")+" + ":""}unused bonus cap`, amount:m.held}); }
    if (unusedSlots > 0) feeBack += unusedSlots*m.c.rate*FEE;
  }
  if (feeBack > 0) L().push({date:"Day 30", type:"feerefund", text:`Rawi fee refunded on unused video slots`, amount:feeBack});
  S.stage = "closed";
  return refund + feeBack;
}
const EV = {fund:["Funded","plain","+"], fee:["Rawi fee","plain",""], release:["Fee paid","ok","−"], bonus:["Bonus paid","ok","−"], refund:["Returned","sf","−"], feerefund:["Fee refund","sf",""]};

function videoStats(v){
  const c = byId(v.creator); const eng = (v.likes+v.comments+v.shares)/v.views;
  const cpm = c.rate / v.views * 1000; const bonus = Math.min(BONUS_CAP, v.views/1000*BONUS_PER_K);
  const rec = (v.watch>=55 && eng>=0.07) ? {t:"Boost as ad", k:"ok"} : v.views<30000 ? {t:"Keep organic", k:"plain"} : {t:"Rehire creator", k:"sf"};
  return {c, eng, cpm, bonus, rec};
}
function dailySeries(vids){
  const out = DAYS.map(()=>0);
  vids.forEach(v => {
    const w = DAYS.map((_,d)=> d<v.start?0:Math.exp(-(d-v.start)/3)); const sum = w.reduce((a,b)=>a+b,0);
    w.forEach((x,d)=> out[d] += v.views*x/sum);
  });
  return out.map(Math.round);
}
function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));const m=raw/p;return (m<=1?1:m<=2?2:m<=5?5:10)*p}
function lineChart(series){
  const W=(innerWidth<560?360:640),H=220,L=44,R=12,T=12,B=28; const max=Math.max(...series,1); const step=niceStep(max); const top=Math.ceil(max/step)*step;
  const x=i=>L+(W-L-R)*i/(series.length-1), y=v=>T+(H-T-B)*(1-v/top);
  const pts=series.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const ticks=[];for(let v=0;v<=top;v+=step)ticks.push(v);
  const k=v=>v>=1000?(v/1000)+"K":String(v);

    <g class="grid">${ticks.map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>
    ${ticks.map(v=>`<text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${k(v)}</text>`).join("")}
    ${(W<500?[0,6,last]:[0,4,8,last]).map(i=>`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="${i===0?"start":i===last?"end":"middle"}">${DAYS[i]}</text>`).join("")}
    <polygon class="area" points="${L},${y(0)} ${pts} ${x(last)},${y(0)}"/>
    <polyline class="line" points="${pts}"/>
    <circle class="dot" cx="${x(last)}" cy="${y(series[last])}" r="4"/>
    <line class="xh" id="xh" x1="0" x2="0" y1="${T}" y2="${H-B}" visibility="hidden"/>
    <circle class="dot" id="hd" r="5" cx="0" cy="0" visibility="hidden"/>
    <rect id="hit" x="${L}" y="0" width="${W-L-R}" height="${H}" fill="transparent"/>
  </svg><div class="tip" id="tip" hidden></div></div>`;
}

/* ===== 3. AI video review ===== */
async function extractFrames(file){
  const url = URL.createObjectURL(file);
  try {
    const v = document.createElement("video"); v.muted = true; v.playsInline = true; v.preload = "auto"; v.src = url;
    await new Promise((res, rej) => { v.onloadeddata = res; v.onerror = () => rej(new Error("This video format can't be read here. Try an MP4.")); });
    const d = v.duration && isFinite(v.duration) ? v.duration : 4;
    const times = [Math.min(0.6, d*0.1), d*0.35, d*0.65, Math.max(0, d-0.4)];
    const c = document.createElement("canvas"); const w = 360, h = Math.round((v.videoHeight||640)/(v.videoWidth||360)*w);
    c.width = w; c.height = h; const g = c.getContext("2d"); const blobs = [], thumbs = [];
    for (const t of times){
      await new Promise(res => { v.onseeked = res; v.currentTime = t; });
      g.drawImage(v, 0, 0, w, h);
      thumbs.push(c.toDataURL("image/jpeg", .7));
      blobs.push(await new Promise(res => c.toBlob(res, "image/jpeg", .8)));
    }
    return {name:file.name, duration:d, vw:v.videoWidth, vh:v.videoHeight, blobs, thumbs, times};
  } finally { URL.revokeObjectURL(url); }
}
function videoLocalChecks(vd){

    {label:"Length 15–60 seconds", pass: vd.duration >= 15 && vd.duration <= 60, note: vd.duration.toFixed(1)+" s"}
  ];
}

const monthsLeft = exp => { if (!exp) return -99; const [y,m] = exp.split("-").map(Number); return (y-2026)*12 + (m-10); };
function complianceData(){
  const creators = Object.keys(S.contracts).map(id => { const c = byId(id), ml = monthsLeft(c.permit.exp);
    const state = c.permit.status!=="verified" || ml < 0 ? "bad" : ml <= 3 ? "warn" : "ok";
    return {c, ml, state, label: state==="bad"?"Not valid":state==="warn"?`Expires ${c.permit.exp}`:"Valid"}; });
  const posts = [
    ...VIDEOS.filter(v=>S.contracts[v.creator]).map(v => { const k = POSTCHK[v.id]; return {title:v.title, c:byId(v.creator), where:PLAT[v.platform].name, disc:k.disc, permit:k.permit, claims:true, state:k.fixed?"fixed":"ok", note:k.fixed||""}; }),
    ...S.drafts.filter(d=>d.status==="approved").map(d => { const c = byId(d.creator); const lc = localChecks(d.text, c); const iss = d.issues || [];
      return {title:"Approved draft", c, where:"Draft", disc:lc[0].pass, permit:lc[1].pass, claims:lc[2].pass, state: iss.length?"bad":"ok", note: iss.length?"Approved with failed checks: "+iss.join(", "):""}; })
  ];
  const issues = creators.filter(x=>x.state==="bad").length + posts.filter(p=>p.state==="bad").length;
  const alerts = creators.filter(x=>x.state==="warn");
  return {creators, posts, issues, alerts};
}

function render(){
  document.querySelectorAll("[data-mode]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.mode===S.mode)));
  const tab = S.tab[S.mode];
  const pending = S.drafts.filter(d=>d.status==="submitted").length;
  document.getElementById("tabs").innerHTML = TABS[S.mode].map(([k,l]) => `<button data-tab="${k}" ${k===tab?'aria-current="page"':""}>${l}${k==="drafts"&&pending?`<span class="n">${pending}</span>`:""}${k==="creators"?`<span class="n">${S.invited.size}</span>`:""}</button>`).join("");
  const ctx = document.getElementById("ctx");
  if (S.mode==="brand"){ const nV = Object.values(S.contracts).reduce((a,k)=>a+k.videos,0); const held = sumL("fund")-sumL("release")-sumL("bonus")-sumL("refund");
    document.getElementById("ctx-in").innerHTML = `<span><span class="dot"></span><b>Tamrah</b> · ${esc(S.brief.title)}</span><span>${Object.keys(S.contracts).length} creators · ${nV} videos</span><span>${S.stage==="closed"?"Closed · escrow empty":"In escrow <b>"+aed(held)+"</b>"}</span>`; ctx.hidden = false; }
  else { document.getElementById("ctx-in").innerHTML = `<span><span class="dot"></span><b>${esc(ME.name)}</b> · ${esc(ME.city)}</span><span>${esc(ME.permit.type)} <span class="mono">${esc(ME.permit.no)}</span></span><span>${ME.rel}% on time</span>`; ctx.hidden = false; }
  const active = document.activeElement?.id; const sel = active && document.activeElement.selectionStart;
  document.getElementById("view").innerHTML = VIEWS[tab]();
  if (active){const el=document.getElementById(active); if(el){el.focus(); try{if(sel!=null)el.setSelectionRange(sel,sel)}catch{}}}
}

let tt; function toast(m){const t=document.getElementById("toast");document.getElementById("toast-msg").textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2600)}

/* ---------- Events ---------- */
document.addEventListener("click", async e => {
  const m = e.target.closest("[data-mode]"); if (m){S.mode=m.dataset.mode;store.set("mode",S.mode);render();scrollTo(0,0);return}
  const t = e.target.closest("[data-tab],[data-go]"); if (t){S.tab[S.mode]=t.dataset.tab||t.dataset.go;store.set("tab",S.tab);render();scrollTo(0,0);return}
  const a = e.target.closest("[data-act]"); if (!a) return;
  const id = a.dataset.id;
  switch(a.dataset.act){
    case "brief": S.briefErr=""; writeBrief(); break;
    case "permitOnly": S.permitOnly = a.checked; render(); break;
    case "invite": {
      const c = byId(id);
      if (S.stage==="closed"){ toast("This campaign is closed"); break; }
      if (S.invited.has(id)){
        if (countL("release",id)>0){ toast(c.name+" already has approved videos and can't be removed"); break; }
        const m = creatorMoney(id);
        if (m){ L().push({date:"Today", type:"refund", creator:id, text:`Invite withdrawn: ${c.name}'s escrow returned to brand`, amount:m.held}); L().push({date:"Today", type:"feerefund", text:`Rawi fee refunded for ${c.name}`, amount:m.videos*c.rate*FEE}); delete S.contracts[id]; }
        S.invited.delete(id); toast("Invite withdrawn. "+aed(m?m.held:0)+" returned to the brand");
      } else {
        S.invited.add(id); S.contracts[id] = {videos:2}; topUp(id, 2, "new invite");
        toast("Invited "+c.name+". Escrow topped up by "+aed(2*(c.rate+BONUS_CAP)));
      }
      render(); break; }
    case "bonus7": { const r = runBonus(7); toast(aed(r.total)+" in day-7 bonuses paid"+(r.skipped.length?" · "+r.skipped.length+" video(s) skipped: not connected":"")); render(); break; }
    case "bonus30": { const r = runBonus(30); toast(aed(r.total)+" in day-30 bonuses paid"); render(); break; }
    case "close": { const back = closeCampaign(); toast("Campaign closed. "+aed(back)+" returned to the brand"); render(); break; }
    case "ledger": S.showLedger = !S.showLedger; render(); break;
    case "aicheck": { const d=S.drafts.find(x=>x.id===id); const r=await aiCheck(d.text, byId(d.creator), "d_"+id); if(r){d.ai=r} render(); break; }
    case "revise": { const d=S.drafts.find(x=>x.id===id); d.status="revise"; toast("Sent back to "+byId(d.creator).name+" with the checklist"); render(); break; }
    case "approve": { const d=S.drafts.find(x=>x.id===id); const c=byId(d.creator); approveDraft(d); toast("Approved. "+aed(c.rate)+" paid to "+c.name+" from escrow"); render(); break; }
    case "apply": S.applied.add(id); toast("Brief accepted"); render(); break;
    case "creatorcheck": { const r=await aiCheck(S.creatorDraft, ME, "creator"); if(r) S.creatorAi=r; render(); break; }
    case "userewrite": if(S.creatorAi?.rewrite){S.creatorDraft=S.creatorAi.rewrite; S.creatorAi=null; render();} break;
    case "creatorsubmit": { const lc=localChecks(S.creatorDraft, ME); if(lc.some(x=>!x.pass)){toast("Fix the failed checks before submitting");break} S.drafts.unshift({id:"d"+Date.now(), creator:ME.id, text:S.creatorDraft, status:"submitted", ai:null}); toast("Submitted to Tamrah. Switch to Brand to review it."); render(); break; }
    case "withdraw": toast("Withdrawals are simulated in this prototype"); break;
    case "connect": S.consent = a.dataset.p; render(); break;
    case "cancelconsent": S.consent = null; render(); break;
    case "allow": S.conn[ME.id][a.dataset.p] = true; S.consent = null; toast(PLAT[a.dataset.p].name+" connected. Your campaign views now show to the brand."); render(); break;
    case "disconnect": S.conn[ME.id][a.dataset.p] = false; toast(PLAT[a.dataset.p].name+" disconnected"); render(); break;
    case "sync": { const d=new Date(); S.synced = String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); toast("Synced with TikTok and Instagram"); render(); break; }
    case "insight": getInsight(); break;
    case "aifit": aiFit(); break;
    case "vidai": { const d=S.drafts.find(x=>x.id===id); if (d?.video) reviewVideo(d); break; }
    case "vidclear": { const d=S.drafts.find(x=>x.id===id); if (d){ d.video=null; d.vai=null; render(); } break; }
    case "usehook": { const l = LIBRARY[+a.dataset.i]; if (l && !S.brief.hooks.includes(l.hook)){ S.brief = {...S.brief, hooks:[...S.brief.hooks, l.hook]}; toast("Hook added to the brief"); render(); } break; }
    case "adlaunch": S.ads = boostPlan(); toast("Boost requests sent to creators. Ads go live once they approve."); render(); break;
    case "adstop": S.ads = null; toast("Boosts paused"); render(); break;
    case "storeask": S.storeConsent = a.dataset.s; render(); break;
    case "storecancel": S.storeConsent = null; render(); break;
    case "storeallow": S.store = S.storeConsent; S.storeConsent = null; toast(STORES[S.store]+" connected"); render(); break;
    case "storeoff": S.store = null; render(); break;
    case "report": downloadReport(); break;
  }
});
/* Chart hover: crosshair + tooltip */
function chartHover(e){
  const wrap = document.getElementById("chart"); if (!wrap) return;
  const hit = document.getElementById("hit"), tip = document.getElementById("tip"), xh = document.getElementById("xh"), hd = document.getElementById("hd");
  if (!wrap.contains(e.target) || e.type==="pointerleave"){ tip.hidden = true; xh.setAttribute("visibility","hidden"); hd.setAttribute("visibility","hidden"); return; }
  const series = wrap.dataset.series.split(",").map(Number);
  const svg = wrap.querySelector("svg"); const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  const L = +hit.getAttribute("x"), Wd = +hit.getAttribute("width");
  const i = Math.max(0, Math.min(series.length-1, Math.round((p.x-L)/Wd*(series.length-1))));
  const line = wrap.querySelector(".line").getAttribute("points").split(" ")[i].split(",").map(Number);
  xh.setAttribute("x1",line[0]); xh.setAttribute("x2",line[0]); xh.setAttribute("visibility","visible");
  hd.setAttribute("cx",line[0]); hd.setAttribute("cy",line[1]); hd.setAttribute("visibility","visible");
  const r = svg.getBoundingClientRect(), wr = wrap.getBoundingClientRect(), sc = r.width/(+wrap.dataset.w||640);
  tip.textContent = DAYS[i]+" · "+fmt(series[i])+" views"; tip.hidden = false;
  const left = Math.max(60, Math.min(wr.width-60, line[0]*sc));
  tip.style.left = left+"px"; tip.style.top = (line[1]*sc)+"px";
}
document.addEventListener("pointermove", chartHover);
document.addEventListener("pointerdown", chartHover);
document.addEventListener("pointerleave", chartHover, true);

document.addEventListener("change", async e => {
  const vid = e.target.dataset?.vid;
  if (vid && e.target.files?.[0]){
    const d = S.drafts.find(x=>x.id===vid); const key = "v_"+vid;
    S.busy[key] = "Reading the video…"; render();
    try { d.video = await extractFrames(e.target.files[0]); d.vai = null; } catch(err){ toast(err.message || "This video couldn't be read."); }
    S.busy[key] = ""; render(); return;
  }
  if (e.target.id === "adBudget"){ render(); return; }
  if (e.target.id !== "introvid" || !e.target.files?.[0]) return;
  S.voice = {status:"running", name:e.target.files[0].name}; render();
  setTimeout(() => { S.voice.status = "done"; toast("Language check complete"); render(); }, 2200);
});
document.addEventListener("input", e => {
  const k = e.target.dataset?.bind; if (!k) return;
  S[k] = e.target.type==="number" ? Number(e.target.value) : e.target.value;
  if (k==="creatorDraft"){ const lc=localChecks(S.creatorDraft, ME); const ul=document.getElementById("livechecks"); if(ul) ul.innerHTML = lc.map(x=>`<li><span class="ic ${x.pass?"p":"f"}">${x.pass?"✓":"✕"}</span><span>${esc(x.label)}${x.note?` <span class="muted">— ${esc(x.note)}</span>`:""}</span></li>`).join(""); }
});

render();
})();
